[tool.poetry]
name = "mielib"
version = "0.2.1"
description = "Python library with many Mie-related functions for optics and acoustics"
authors = ["Ivan Toftul <toftul.ivan@gmail.com>"]
readme = "README.md"
repository = "https://github.com/toftul/mielib"
homepage = "https://github.com/toftul/mielib"
license = "MIT"

[tool.poetry.dependencies]
python = ">=3.12"
scipy = ">=1.18"


[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.group.dev.dependencies]
pytest = ">=8"

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["error::DeprecationWarning"]
