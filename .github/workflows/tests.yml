name: Tests

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
          cache-dependency-path: pyproject.toml

      - name: Install the package and pytest
        run: |
          python -m pip install --upgrade pip
          pip install . pytest

      - name: Run the tests
        run: pytest

  notebooks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: "pip"
          cache-dependency-path: pyproject.toml

      - name: Install the package and the notebook tools
        run: |
          python -m pip install --upgrade pip
          pip install . pytest nbmake matplotlib

      # each notebook fails if a cell raises an error, for example after a change of the API
      - name: Run the example notebooks
        run: pytest --nbmake examples
